[package]
name = "block_viewer"
version = "0.1.0"
edition = "2024"

# Ticket 027: one package, one lib, two binary shims — the viewer and the
# citybuilder both live *inside* the lib (`src/viewer`, `src/city`) over a
# shared core, so `pub(crate)` keeps working across every shared module.
# The `mc_core`/`block_viewer`/`citybuilder` workspace split stays available
# as a later move, once that core stops changing shape.
[lib]
name = "block_viewer"
path = "src/lib.rs"

[[bin]]
name = "block_viewer"
path = "src/bin/block_viewer.rs"

[[bin]]
name = "citybuilder"
path = "src/bin/citybuilder.rs"

[[bin]]
name = "ranvil-cli"
path = "src/bin/ranvil_cli.rs"

[[bin]]
name = "model-exporter"
path = "src/bin/model_exporter.rs"

[dependencies]
bevy = "0.15.0"
bevy_egui = "0.31.1"
# Argument parsing for the ranvil-cli binary (ticket 087). The only new
# dependency this whole executable adds — everything else it calls into
# already exists in the lib.
clap = { version = "4", features = ["derive"] }
dirs = "5.0.1"
# Gzip for the structure files ticket 023 writes. Already in `Cargo.lock` —
# `ranvil` pulls it in for region decompression — so naming it here costs no
# new download or compile.
flate2 = "1.0.35"
# Only for decoding the vanilla resource pack's PNGs into the startup atlas
# (ticket 004) — bevy_image/arboard already pull in `image` with `png`
# support, so this adds no new download.
image = { version = "0.25.5", default-features = false, features = ["png"] }
mc_anvil = { package = "ranvil", version = "0.1.0", path = "../ranvil" }
# Building definitions (ticket 040): RON deserialization for
# `city::definition::Building`. Both are already in `Cargo.lock`
# transitively (bevy pulls `serde`; something in the tree already pulls
# `ron`), so this names existing versions rather than adding new downloads.
ron = "0.8.1"
# The native save dialog behind the Export button (ticket 024). The
# platform's own dialog — including its overwrite prompt — instead of an
# in-app egui file browser we would have to grow directory navigation,
# filtering and drive switching into.
rfd = "0.17.2"
rnbt = { version = "0.1.0", path = "../rnbt" }
serde = { version = "1.0.217", features = ["derive"] }
# `ranvil_cli::format`'s JSON output (ticket 087). Already in `Cargo.lock` —
# bevy pulls it in transitively — so this names an existing version rather
# than adding a new download, same as `flate2`/`ron` above.
serde_json = "1.0.134"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
